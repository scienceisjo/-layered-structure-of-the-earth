/* ═══ SOUND ENGINE ═══ */
const SFX = {
  _ready: false,
  async init() {
    if (this._ready) return;
    await Tone.start();
    this._ready = true;
  },
  drill() {
    if (!this._ready) return;
    const s = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.05, release: 0.1 }, volume: -20 }).toDestination();
    s.triggerAttackRelease("C2", "16n");
  },
  layerEnter() {
    if (!this._ready) return;
    const s = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.3, sustain: 0, release: 0.3 }, volume: -12 }).toDestination();
    s.triggerAttackRelease("G4", "8n");
    setTimeout(() => { const s2 = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.3, sustain: 0, release: 0.3 }, volume: -12 }).toDestination(); s2.triggerAttackRelease("C5", "8n"); }, 150);
  },
  achievement() {
    if (!this._ready) return;
    const notes = ["C5", "E5", "G5", "C6"];
    notes.forEach((n, i) => {
      setTimeout(() => { const s = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.02, decay: 0.4, sustain: 0, release: 0.5 }, volume: -8 }).toDestination(); s.triggerAttackRelease(n, "8n"); }, i * 120);
    });
  },
  correct() {
    if (!this._ready) return;
    const s = new Tone.Synth({ oscillator: { type: "triangle" }, volume: -10 }).toDestination();
    s.triggerAttackRelease("E5", "16n");
    setTimeout(() => { const s2 = new Tone.Synth({ oscillator: { type: "triangle" }, volume: -10 }).toDestination(); s2.triggerAttackRelease("G5", "16n"); }, 100);
  },
  wrong() {
    if (!this._ready) return;
    const s = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }, volume: -18 }).toDestination();
    s.triggerAttackRelease("D3", "8n");
  },
  click() {
    if (!this._ready) return;
    const s = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.08, sustain: 0, release: 0.05 }, volume: -16 }).toDestination();
    s.triggerAttackRelease("A4", "32n");
  },
  wave() {
    if (!this._ready) return;
    const s = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.3, decay: 1, sustain: 0, release: 1 }, volume: -14 }).toDestination();
    s.triggerAttackRelease("E3", "2n");
  },
  capture() {
    if (!this._ready) return;
    ["C5","E5","G5","C6","E6"].forEach((n,i) => {
      setTimeout(() => { const s = new Tone.Synth({ oscillator: { type: "triangle" }, volume: -8 }).toDestination(); s.triggerAttackRelease(n, "8n"); }, i * 100);
    });
  }
};

const lerp=(a,b,t)=>a+(b-a)*t;
const getTempAt=d=>{if(d<35)return lerp(20,500,d/35);if(d<2900)return lerp(500,4000,(d-35)/2865);if(d<5100)return lerp(4000,5000,(d-2900)/2200);return lerp(5000,6000,(d-5100)/1271);};
const getPressAt=d=>{if(d<35)return lerp(0,1,d/35);if(d<2900)return lerp(1,136,(d-35)/2865);if(d<5100)return lerp(136,330,(d-2900)/2200);return lerp(330,360,(d-5100)/1271);};
const getDensAt=d=>{if(d<35)return lerp(2.7,3,d/35);if(d<2900)return lerp(3.3,5.5,(d-35)/2865);if(d<5100)return lerp(9.9,12.2,(d-2900)/2200);return lerp(12.8,13.1,(d-5100)/1271);};

/* ═══ EARTH SVG ═══ */
function EarthSVG({activeLayer,onLayerClick,drillDepth,shaking,compact}){
  const layers=[{id:"inner-core",r:LR["inner-core"],c1:"#FFD700",c2:"#CC9900"},{id:"outer-core",r:LR["outer-core"],c1:"#F5A623",c2:"#B87A0A"},{id:"mantle",r:LR["mantle"],c1:"#C94A2E",c2:"#8A2A15"},{id:"crust",r:SVG_R,c1:"#B5845A",c2:"#7A5530"}];
  const drillY=-SVG_R+(Math.min(drillDepth,DRILL_MAX)/EARTH_R)*SVG_R;
  const cl=getLayerAt(drillDepth);
  return <svg viewBox="-195 -195 390 390" style={{width:"100%",maxWidth:compact?300:380,height:"auto",animation:shaking?"shake .08s linear infinite":"none",filter:"drop-shadow(0 4px 24px rgba(245,166,35,.12))"}}>
    <defs><radialGradient id="cG"><stop offset="0%" stopColor="#FFFBE0" stopOpacity=".7"/><stop offset="100%" stopColor="#FFD700" stopOpacity="0"/></radialGradient><clipPath id="rH"><rect x="0" y="-195" width="195" height="390"/></clipPath><clipPath id="lH"><rect x="-195" y="-195" width="195" height="390"/></clipPath></defs>
    <g clipPath="url(#lH)"><circle r={SVG_R} fill="#1B4332"/><ellipse cx="-65" cy="-45" rx="55" ry="30" fill="#2D6A4F" opacity=".7"/><ellipse cx="-25" cy="45" rx="75" ry="24" fill="#40916C" opacity=".5"/><ellipse cx="-120" cy="18" rx="38" ry="50" fill="#1E5068" opacity=".6"/></g>
    <g clipPath="url(#rH)">{[...layers].reverse().map(l=><circle key={l.id} r={l.r} fill={activeLayer===l.id?l.c1:l.c2} stroke={activeLayer===l.id?"#fff":"rgba(255,255,255,.08)"} strokeWidth={activeLayer===l.id?3:.5} onClick={()=>{SFX.click();onLayerClick(l.id);}} style={{cursor:"pointer",transition:"all .4s"}}/>)}<circle r={layers[0].r} fill="url(#cG)" pointerEvents="none"/></g>
    <line x1="0" y1={-SVG_R-3} x2="0" y2={SVG_R+3} stroke="rgba(255,255,255,.1)" strokeWidth="1"/>
    {[{d:35,l:"35"},{d:2900,l:"2,900"},{d:5100,l:"5,100"}].map(({d,l})=>{const y=-SVG_R+(d/EARTH_R)*SVG_R;return <g key={d}><line x1={SVG_R+2} y1={y} x2={SVG_R+16} y2={y} stroke="rgba(255,255,255,.25)" strokeWidth=".7" strokeDasharray="2,2"/><text x={SVG_R+19} y={y+4} fill="rgba(255,255,255,.4)" fontSize="8" className="fira">{l}km</text></g>;})}
    {[{y:-SVG_R+10,l:"지각"},{y:-SVG_R+(1467/EARTH_R)*SVG_R,l:"맨틀"},{y:-SVG_R+(4000/EARTH_R)*SVG_R,l:"외핵"},{y:-SVG_R+(5735/EARTH_R)*SVG_R,l:"내핵"}].map(({y,l})=><text key={l} x="55" y={y} fill="rgba(255,255,255,.22)" fontSize="9" textAnchor="middle" className="noto" fontWeight="600">{l}</text>)}
    {drillDepth>0&&<g>
      <line x1="4" y1={-SVG_R} x2="4" y2={drillY} stroke="#C8C8C8" strokeWidth="3" strokeLinecap="round"/>
      <g transform={`translate(4,${drillY})`} style={{animation:"drillBit .08s linear infinite"}}><polygon points="-6,-3 6,-3 0,10" fill={cl.color}/><circle r="2.5" cy="-1" fill="white" opacity=".9"/></g>
      {drillDepth<DRILL_MAX&&[0,1,2].map(i=><circle key={i} cx={4+Math.sin(i*2.5)*9} cy={drillY} r={1.3} fill={cl.colorLight} opacity=".8"><animate attributeName="opacity" from=".9" to="0" dur=".35s" repeatCount="indefinite" begin={`${i*.1}s`}/><animate attributeName="cy" from={drillY} to={drillY-14} dur=".4s" repeatCount="indefinite" begin={`${i*.1}s`}/></circle>)}
      {drillDepth>=DRILL_MAX&&<g transform={`translate(4,${drillY})`} style={{animation:"popIn .4s"}}><line x1="-10" y1="16" x2="10" y2="16" stroke="#2ECC71" strokeWidth="3" strokeLinecap="round"/><text x="0" y="30" fill="#2ECC71" fontSize="8" textAnchor="middle" className="noto" fontWeight="800">시추 완료!</text></g>}
      <text x="18" y={drillY+4} fill={cl.colorLight} fontSize="8" className="fira" opacity=".8">{Math.round(drillDepth)}km</text>
    </g>}
  </svg>;
}

/* ═══ GAUGE ═══ */
function Gauge({label,value,max,unit,color,icon}){const pct=Math.min((value/max)*100,100);return <div style={{flex:1,minWidth:0}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span className="noto" style={{fontSize:11,color:"var(--dim)",fontWeight:600}}>{icon} {label}</span><span className="fira" style={{fontSize:12,color,fontWeight:600}}>{value>100?Math.round(value).toLocaleString():value.toFixed(1)}{unit}</span></div><div style={{height:7,background:"rgba(0,0,0,.4)",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${color}88,${color})`,borderRadius:4,transition:"width .15s linear"}}/></div></div>;}

      <span className="noto" style={{fontWeight:800,color:"var(--text)",fontSize:15}}>⛏️ 드릴 시뮬레이터</span>
      <span className="fira" style={{color:"var(--accent)",fontSize:14,fontWeight:600}}>{Math.round(depth).toLocaleString()} / {DRILL_MAX.toLocaleString()} km</span>

    <div style={{position:"relative",height:28,background:"rgba(0,0,0,.45)",borderRadius:14,overflow:"hidden",marginBottom:12}}>

      {[35,2900,5100].map(d=><div key={d} style={{position:"absolute",top:0,bottom:0,left:`${(d/DRILL_MAX)*100}%`,width:1,background:"rgba(255,255,255,.2)"}}/>)}
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><span className="noto" style={{fontSize:11,color:"white",fontWeight:700,textShadow:"0 1px 3px rgba(0,0,0,.6)"}}>{layer.emoji} {layer.name}</span></div>
    </div>

      <Gauge label="압력" value={getPressAt(depth)} max={330} unit=" GPa" color="#4488FF" icon="💎"/>
      <Gauge label="밀도" value={getDensAt(depth)} max={12.2} unit="" color="#44DD88" icon="⚖️"/>
    </div>
    <div style={{display:"flex",gap:8,alignItems:"center"}}>
      {depth>=DRILL_MAX?<button className="btn" onClick={()=>{SFX.click();onReset();}} style={{flex:1,padding:"10px 0",borderRadius:10,background:"linear-gradient(135deg,#27AE60,#2ECC71)",color:"white",fontSize:14}}>🔄 처음부터</button>
      :<button className="btn" onClick={()=>{SFX.click();drilling?onStop():onStart();}} style={{flex:1,padding:"10px 0",borderRadius:10,background:drilling?"linear-gradient(135deg,#E74C3C,#C0392B)":"linear-gradient(135deg,#3498DB,#2980B9)",color:"white",fontSize:14}}>{drilling?"⏸ 정지":"▶ 시작!"}</button>}
      <div style={{display:"flex",gap:3}}>
        {[0.5,1,3,8,20].map(s=><button key={s} className="btn" onClick={()=>{SFX.click();onSpeed(s);}} style={{width:36,height:32,borderRadius:8,fontSize:10,border:speed===s?"2px solid var(--accent)":"1px solid var(--border)",background:speed===s?"rgba(245,166,35,.15)":"rgba(0,0,0,.2)",color:speed===s?"var(--accent)":"var(--dim)"}}>{s}x</button>)}
      </div>

}

/* ═══ SEISMIC TAB ═══ */
function SeismicTab({onComplete}){
  const[step,setStep]=useState(0);const[pR,setPR]=useState(0);const[sR,setSR]=useState(0);const[sB,setSB]=useState(false);const[pLoop,setPLoop]=useState(false);const[sLoop,setSLoop]=useState(false);const[tick,setTick]=useState(0);
  const aRef=useRef(null);const lRef=useRef(null);
  const ocR=LR["outer-core"],icR=LR["inner-core"],mR=LR["mantle"];
  const EX=-100,EY=-130;
  const STEPS=[
    {t:"지진파 분석법이란?",b:"지진이 발생하면 그 지점(**진원**: 지각 내부에서 지진이 시작된 곳)에서 **P파(종파)**와 **S파(횡파)** 두 종류의 지진파가 퍼져나갑니다. 과학자들은 이 파동을 관측하여 지구 내부 구조를 **간접적으로** 알아냈습니다.",h:"start"},
    {t:"P파 (종파) 발사!",b:"P파는 **고체와 액체 모두** 통과합니다. **파란색 파동**이 지구 전체를 뚫고 지나갑니다!",h:"p"},
    {t:"S파 (횡파) 발사!",b:"S파는 **고체만** 통과합니다. 외핵에 도달하면? **빨간색 파동**을 관찰하세요!",h:"s"},
    {t:"🔍 S파가 사라졌다!",b:"S파가 외핵에서 **완전히 차단**! 액체를 통과할 수 없기 때문이죠. 외핵이 **액체**라는 핵심 근거!",h:"sb"},
    {t:"외핵: 액체 철·니켈",b:"P파 속도 분석 → 외핵은 **철과 니켈**로 이루어져 있고, 액체 상태의 철 대류가 **지구 자기장**을 만듭니다!",h:"oc"},
    {t:"내핵은 왜 고체?",b:"P파가 내핵에서 **속도가 급증**합니다. 같은 철·니켈이지만 **330~360 GPa의 극한 압력**이 물질을 꾹꾹 눌러 ~6,000°C에서도 **고체**!",h:"ic"},
    {t:"🎉 추론 완료!",b:"• S파 차단 → 외핵 **액체**\n• P파 분석 → **철·니켈**\n• 극한 압력 → 내핵 **고체**\n\n직접 갈 수 없는 지구 내부를 간접적으로 밝혀냈습니다!",h:"done"},
  ];
  const stop=()=>{if(aRef.current)clearInterval(aRef.current);if(lRef.current)clearInterval(lRef.current);setPLoop(false);setSLoop(false);};
  useEffect(()=>{stop();
    if(step===1){setPR(0);setSR(0);setSB(false);SFX.wave();let r=0;aRef.current=setInterval(()=>{r+=3;setPR(r);if(r>SVG_R*2.2){clearInterval(aRef.current);setPLoop(true);let t=0;lRef.current=setInterval(()=>{t++;setTick(t);},60);}},25);}
    else if(step===2){setSR(0);setSB(false);SFX.wave();let r=0;aRef.current=setInterval(()=>{r+=2.5;if(r>=ocR+5){setSB(true);SFX.wrong();clearInterval(aRef.current);setSR(ocR);setSLoop(true);let t=0;lRef.current=setInterval(()=>{t++;setTick(t);},60);return;}setSR(r);},25);}
    else if(step>=3){setSB(true);setSR(ocR);}
    return stop;
  },[step]);
  useEffect(()=>{if(step===STEPS.length-1){onComplete("seismic-clear");SFX.achievement();}},[step,onComplete]);

  const cur=STEPS[step];
  const fmt=t=>{const p=t.split(/(\*\*[^*]+\*\*)/g);return p.map((x,i)=>{if(x.startsWith("**")&&x.endsWith("**"))return <strong key={i} style={{color:"var(--accent)",fontWeight:800}}>{x.slice(2,-2)}</strong>;if(x.includes("\n"))return x.split("\n").map((l,j)=><span key={`${i}-${j}`}>{l}{j<x.split("\n").length-1&&<br/>}</span>);return x;});};
  const pWaves=()=>{if(step<1)return null;const rings=[];if(pLoop){for(let i=0;i<6;i++){const br=((tick*3+i*55)%(SVG_R*2.5));if(br<5||br>SVG_R*2.2)continue;const op=Math.max(0,.85-br/(SVG_R*2));rings.push(<circle key={`pl${i}`} cx={EX} cy={EY} r={br} fill="none" stroke="#4499FF" strokeWidth={5+(1-br/(SVG_R*2))*4} opacity={op} strokeDasharray="8,5"/>);}}else if(pR>0){for(let i=0;i<5;i++){const r=pR-i*40;if(r<=0||r>SVG_R*2.2)continue;const op=Math.max(0,.9-r/(SVG_R*2));rings.push(<circle key={`p${i}`} cx={EX} cy={EY} r={r} fill="none" stroke="#4499FF" strokeWidth={6+(1-r/(SVG_R*2))*5} opacity={op} strokeDasharray="8,5"/>);}}return <g>{rings}</g>;};
  const sWaves=()=>{if(step<2)return null;const rings=[];if(sLoop&&step<=3){for(let i=0;i<5;i++){const br=((tick*2.5+i*45)%(ocR+20));if(br<5)continue;const cr=Math.min(br,ocR);const op=Math.max(0,.9-cr/(ocR+10));rings.push(<circle key={`sl${i}`} cx={EX} cy={EY} r={cr} fill="none" stroke="#FF4455" strokeWidth={5+(1-cr/ocR)*5} opacity={op}/>);}}else if(sR>0){for(let i=0;i<4;i++){const r=Math.min(sR-i*35,ocR);if(r<=0)continue;const op=Math.max(0,.9-r/(ocR+10));rings.push(<circle key={`s${i}`} cx={EX} cy={EY} r={r} fill="none" stroke="#FF4455" strokeWidth={6+(1-r/ocR)*5} opacity={op}/>);}}return <g>{rings}</g>;};
  const blocked=()=>{if(!sB&&step<3)return null;return <g>{[20,55,90,125,160].map((a,i)=>{const rad=a*Math.PI/180;const bx=EX+Math.cos(rad)*ocR;const by=EY+Math.sin(rad)*ocR;if(bx*bx+by*by>SVG_R*SVG_R*1.05)return null;return <g key={a} transform={`translate(${bx},${by})`} style={{animation:`popIn .3s ease ${i*.05}s both`}}><circle r="8" fill="#FF4455" opacity=".2"/><line x1="-5" y1="-5" x2="5" y2="5" stroke="#FF4455" strokeWidth="3" strokeLinecap="round"/><line x1="5" y1="-5" x2="-5" y2="5" stroke="#FF4455" strokeWidth="3" strokeLinecap="round"/></g>;})}</g>;};
  const getF=id=>{const b={crust:"#7A5530",mantle:"#8A2A15","outer-core":"#B87A0A","inner-core":"#CC9900"};const br2={crust:"#9A7550",mantle:"#A84A25","outer-core":"#D89A1A","inner-core":"#DDAA00"};if(cur.h==="oc"&&id==="outer-core")return br2[id];if(cur.h==="ic"&&id==="inner-core")return br2[id];return b[id];};
  const getSW=id=>{if((cur.h==="sb"||cur.h==="oc")&&id==="outer-core")return 4;if(cur.h==="ic"&&id==="inner-core")return 4;return 1.5;};
  const getSC=id=>{if(cur.h==="sb"&&id==="outer-core")return"#FF5555";if(cur.h==="oc"&&id==="outer-core")return"#FFD060";if(cur.h==="ic"&&id==="inner-core")return"#FFE880";return"rgba(255,255,255,.12)";};

  return <div style={{display:"flex",gap:14,animation:"fadeUp .4s",flexWrap:"wrap",alignItems:"flex-start"}}>
    <div style={{flex:"1 1 280px",display:"flex",justifyContent:"center"}}>
      <svg viewBox="-200 -200 400 400" style={{width:"100%",maxWidth:360,height:"auto"}}>
        <defs><radialGradient id="cg2"><stop offset="0%" stopColor="#FFFBE0" stopOpacity=".6"/><stop offset="100%" stopColor="#FFD700" stopOpacity="0"/></radialGradient><clipPath id="ec"><circle r={SVG_R}/></clipPath></defs>

/* ═══ QUIZ ═══ */
function Quiz({onComplete}){
  const qs=useMemo(()=>[...QUIZ_QS].sort(()=>Math.random()-.5).slice(0,7),[]);
  const[ci,setCi]=useState(0);
  const[sel,setSel]=useState(null);
  // ── 중복 클릭 방지: state 대신 ref로 즉시 잠금 ──
  const pickedRef=useRef(false);
  // ── 점수: ref(동기 최신값) + state(화면 표시) ──
  const scoreRef=useRef(0);
  const[scoreDisp,setScoreDisp]=useState(0);
  const[fin,setFin]=useState(false);
  const[finalScore,setFinalScore]=useState(0);

  const pick=i=>{
    // ref로 즉시 잠금 → 빠른 더블클릭 중복 카운트 원천 차단
    if(pickedRef.current)return;
    pickedRef.current=true;
    setSel(i);
    if(i===qs[ci].a){
      scoreRef.current+=1;
      setScoreDisp(scoreRef.current);
      SFX.correct();
    } else {
      SFX.wrong();
    }
  };

  const next=()=>{
    SFX.click();
    if(ci+1>=qs.length){
      // scoreRef.current = 항상 정확한 최종 점수
      const fs=scoreRef.current;
      setFinalScore(fs);
      // onComplete를 setFin 이전에 호출 → unlock이 확실히 실행됨
      if(fs===qs.length){
        onComplete("quiz-perfect");
        SFX.achievement();
      }
      setFin(true);
    } else {
      setCi(c=>c+1);
      setSel(null);
      // 다음 문제로 넘어갈 때 잠금 해제
      pickedRef.current=false;
    }
  };

  if(fin){
    return <div style={{textAlign:"center",padding:16,animation:"fadeUp .4s"}}>
      <div style={{fontSize:64,marginBottom:10}}>{finalScore===qs.length?"🏆":finalScore>=5?"👏":"📚"}</div>
      <div className="bhans" style={{fontSize:28,color:"var(--accent)"}}>{finalScore}/{qs.length}</div>
      <div className="noto" style={{color:"var(--dim)",fontSize:15}}>{finalScore===qs.length?"완벽! 🎉":finalScore>=5?"잘했어요!":"다시 도전!"}</div>
    </div>;
  }

  const q=qs[ci];
  // pickedRef.current로 done 여부 판단 (state done 제거 → 동기화 불일치 원인 제거)
  const answered=pickedRef.current;
  return <div style={{animation:"fadeUp .35s"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
      <span className="fira" style={{color:"var(--dim)",fontSize:12}}>{ci+1}/{qs.length}</span>
      <div style={{display:"flex",gap:5}}>{qs.map((_,i)=><div key={i} style={{width:10,height:10,borderRadius:5,background:i<ci?"var(--accent)":i===ci?"white":"rgba(255,255,255,.15)"}}/>)}</div>
      <span className="fira" style={{color:"var(--accent)",fontSize:12}}>점수:{scoreDisp}</span>
    </div>
    <div className="noto" style={{fontSize:15,fontWeight:700,color:"var(--text)",marginBottom:14,lineHeight:1.7}}>{q.q}</div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {q.o.map((o,i)=>{
        let bg="rgba(255,255,255,.03)",bd="var(--border)",col="var(--text)";
        if(answered){
          if(i===q.a){bg="rgba(46,204,113,.12)";bd="#2ECC71";col="#2ECC71";}
          else if(i===sel){bg="rgba(231,76,60,.12)";bd="#E74C3C";col="#E74C3C";}
        }
        return <button key={i} className="btn" onClick={()=>pick(i)} style={{padding:"11px 16px",borderRadius:10,textAlign:"left",border:`1.5px solid ${bd}`,background:bg,color:col,fontSize:14,fontWeight:600}}>{o}</button>;
      })}
    </div>
    {answered&&<button className="btn" onClick={next} style={{marginTop:12,width:"100%",padding:"10px 0",borderRadius:10,background:"linear-gradient(135deg,#3498DB,#2980B9)",color:"white",fontSize:14}}>{ci+1>=qs.length?"결과 🎉":"다음 →"}</button>}
  </div>;
}

/* ═══ ASSEMBLY ═══ */
function Assembly({onComplete}){const ord=["crust","mantle","outer-core","inner-core"];const[pcs,setPcs]=useState(()=>LAYERS.map(l=>({id:l.id,name:l.name,emoji:l.emoji,color:l.color,colorLight:l.colorLight})).sort(()=>Math.random()-.5));const[placed,setPlaced]=useState([]);const[wrong,setWrong]=useState(false);const[ok,setOk]=useState(false);
  const tryP=p=>{if(p.id===ord[placed.length]){SFX.correct();const np=[...placed,p];setPlaced(np);setPcs(ps=>ps.filter(x=>x.id!==p.id));setWrong(false);if(np.length===4){setOk(true);onComplete("assembly-clear");SFX.achievement();}}else{SFX.wrong();setWrong(true);setTimeout(()=>setWrong(false),800);}};
  const reset=()=>{setPlaced([]);setOk(false);setPcs(LAYERS.map(l=>({id:l.id,name:l.name,emoji:l.emoji,color:l.color,colorLight:l.colorLight})).sort(()=>Math.random()-.5));};
  if(ok)return <div style={{textAlign:"center",padding:20,animation:"fadeUp .4s"}}><div style={{fontSize:64,marginBottom:10}}>🎉</div><div className="bhans" style={{fontSize:24,color:"var(--accent)",marginBottom:10}}>완성!</div><button className="btn" onClick={reset} style={{padding:"8px 28px",borderRadius:10,background:"linear-gradient(135deg,var(--accent),var(--accent2))",color:"white",fontSize:14}}>다시</button></div>;
  const tn=LAYERS.find(l=>l.id===ord[placed.length])?.name||"";
  return <div style={{animation:"fadeUp .35s"}}><div className="noto" style={{fontSize:14,color:"var(--dim)",textAlign:"center",marginBottom:6}}>바깥→안쪽 순서로 탭하세요!</div><div className="noto" style={{fontSize:16,color:"var(--text)",textAlign:"center",marginBottom:14,fontWeight:700}}>다음: <span style={{color:"var(--accent)"}}>{tn}</span></div>
    <div style={{display:"flex",justifyContent:"center",marginBottom:20}}><div style={{width:180,height:180,borderRadius:"50%",border:"2px dashed rgba(255,255,255,.1)",position:"relative",overflow:"hidden"}}>{placed.map((p,i)=>{const sz=[100,75,52,30];return <div key={p.id} style={{position:"absolute",width:`${sz[i]}%`,height:`${sz[i]}%`,left:`${(100-sz[i])/2}%`,top:`${(100-sz[i])/2}%`,borderRadius:"50%",background:`radial-gradient(circle at 40% 40%,${p.colorLight},${p.color})`,animation:"popIn .4s",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:sz[i]>40?20:14}}>{p.emoji}</span></div>;})}</div></div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>{pcs.map(p=><button key={p.id} className="btn" onClick={()=>tryP(p)} style={{padding:"10px 20px",borderRadius:12,background:`linear-gradient(135deg,${p.color}33,${p.color}55)`,border:`2px solid ${p.color}88`,color:p.colorLight,fontSize:14,animation:wrong?"shake .15s linear":"none"}}>{p.emoji} {p.name}</button>)}</div>
    {wrong&&<div className="noto" style={{textAlign:"center",marginTop:10,color:"#E74C3C",fontSize:13,fontWeight:600}}>🤔 다시 생각해보세요!</div>}</div>;
}

/* ═══ DETECTIVE ═══ */
function Detective({onComplete}){const[rnd,setRnd]=useState(0);const[ci,setCi]=useState(0);const[res,setRes]=useState(null);const[score,setScore]=useState(0);
  const[ord]=useState(()=>{
    const s=[...LAYERS].sort(()=>Math.random()-.5);
    const extra=s.slice(0,2).map(l=>({...l,clues:[...l.clues].reverse()})).sort(()=>Math.random()-.5);
    return[...s,...extra];
  });
  const tot=6;const cl=ord[rnd];
  const guess=id=>{if(res!==null)return;const ok=id===cl.id;setRes(ok);if(ok){setScore(s=>s+Math.max(5-ci,1));SFX.correct();}else SFX.wrong();};
  const next=()=>{SFX.click();if(rnd+1>=tot){onComplete("detective-clear");SFX.achievement();setRnd(tot);return;}setRnd(r=>r+1);setCi(0);setRes(null);};
  if(rnd>=tot)return <div style={{textAlign:"center",padding:20,animation:"fadeUp .4s"}}><div style={{fontSize:64,marginBottom:10}}>🔬</div><div className="bhans" style={{fontSize:24,color:"var(--accent)",marginBottom:6}}>수사 완료!</div><div className="noto" style={{color:"var(--text)",fontSize:20,fontWeight:700}}>{score}점</div><div className="noto" style={{color:"var(--dim)",fontSize:13,marginTop:4}}>총 {tot}건 · 최대 {tot*5}점</div></div>;
  return <div style={{animation:"fadeUp .35s",maxWidth:480,margin:"0 auto"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><span className="fira" style={{color:"var(--dim)",fontSize:12}}>사건 {rnd+1}/{tot}</span><span className="bhans" style={{fontSize:17,color:"var(--accent)"}}>🔬 과학 탐정</span><span className="fira" style={{color:"var(--accent)",fontSize:12}}>{score}점</span></div>
    <div className="noto" style={{fontSize:16,fontWeight:700,color:"var(--text)",textAlign:"center",marginBottom:16,lineHeight:1.5}}>단서 카드를 분석하여<br/>이 층의 정체를 밝혀라!</div>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>{cl.clues.slice(0,ci+1).map((c,i)=><div key={i} style={{padding:"12px 16px",borderRadius:14,animation:"fadeUp .3s",background:"linear-gradient(135deg, rgba(245,166,35,.05), rgba(245,166,35,.12))",border:"1px solid rgba(245,166,35,.25)",boxShadow:"0 2px 8px rgba(0,0,0,.15)",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:0,right:0,background:"var(--accent)",color:"var(--bg)",fontSize:9,fontWeight:800,padding:"3px 10px 4px",borderRadius:"0 12px 0 10px",fontFamily:"'Fira Code',monospace"}}>단서 {i+1}</div>
      <div style={{display:"flex",alignItems:"flex-start",gap:10,paddingRight:40}}><span style={{fontSize:20,marginTop:1}}>🔎</span><span className="noto" style={{fontSize:14,color:"rgba(255,255,255,.9)",lineHeight:1.7,fontWeight:500}}>{c}</span></div>
    </div>)}</div>
    {ci<4&&res===null&&<button className="btn" onClick={()=>{SFX.click();setCi(c=>c+1);}} style={{width:"100%",padding:"10px 0",borderRadius:10,marginBottom:14,background:"rgba(245,166,35,.06)",border:"1.5px dashed rgba(245,166,35,.3)",color:"var(--accent)",fontSize:13}}>🃏 다음 단서 카드 열기 (현재 가치: {Math.max(5-ci-1,1)}점)</button>}
    {res===null?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{LAYERS.map(l=><button key={l.id} className="btn" onClick={()=>guess(l.id)} style={{padding:"13px 10px",borderRadius:12,fontSize:14,background:`${l.color}15`,border:`2px solid ${l.color}55`,color:l.colorLight,boxShadow:`0 2px 10px ${l.color}15`}}>{l.emoji} {l.name}</button>)}</div>
    :<div style={{textAlign:"center",animation:"fadeUp .3s"}}><div style={{fontSize:44,marginBottom:8}}>{res?"🎉":"😅"}</div><div className="noto" style={{fontSize:16,fontWeight:700,color:res?"#2ECC71":"#E74C3C",marginBottom:6}}>{res?`정답! +${Math.max(5-ci,1)}점`:"아쉬워요!"}</div><div className="noto" style={{fontSize:13,color:"var(--dim)",marginBottom:12}}>정답: {cl.emoji} {cl.name}</div><button className="btn" onClick={next} style={{padding:"10px 32px",borderRadius:10,background:"linear-gradient(135deg,#3498DB,#2980B9)",color:"white",fontSize:14}}>{rnd+1>=tot?"결과 보기":"다음 사건 →"}</button></div>}
  </div>;
}

            </div>
          </div>
          <EarthSVG activeLayer={aL} onLayerClick={id=>{SFX.click();setAL(aL===id?null:id);}} drillDepth={depth} shaking={shaking} compact/>
          <NotifBar msg={notif}/>
        </div>
        <div style={{flex:"1 1 320px",display:"flex",flexDirection:"column",gap:8}}>
          <DrillPanel depth={depth} drilling={drilling} speed={speed} onStart={start} onStop={stop} onReset={reset} onSpeed={setSpeed}/>
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:350,overflowY:"auto",paddingRight:4}}>
            {LAYERS.map(l=><LayerCard key={l.id} layer={l} active={aL===l.id} onClick={()=>{SFX.click();setAL(aL===l.id?null:l.id);}}/>)}
          </div>
        </div>
      </div>}

      {tab==="note"&&<ExplorationNote onComplete={unlock}/>}
      {tab==="volcano"&&<VolcanicTab/>}
      {tab==="seismic"&&<SeismicTab onComplete={unlock}/>}
      {tab==="compare"&&<div style={{maxWidth:520,margin:"0 auto"}}><CompareView/></div>}
      {tab==="assembly"&&<div className="card" style={{padding:18,maxWidth:480,margin:"0 auto"}}><Assembly key="asm" onComplete={unlock}/></div>}
      {tab==="detective"&&<div className="card" style={{padding:18,maxWidth:500,margin:"0 auto"}}><Detective key={"d"+Date.now()} onComplete={unlock}/></div>}
      {tab==="quiz"&&<div className="card" style={{padding:18,maxWidth:480,margin:"0 auto"}}><Quiz key={"q"+Date.now()} onComplete={unlock}/></div>}
      {tab==="trophy"&&<AchievementsView unlocked={achs}/>}
      <Footer/>
    </div>
  </div>;
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
